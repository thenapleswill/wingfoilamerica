name: TEMP Check 3 Links
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the 3 flagged URLs in detail
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          for url in "https://wingfoilamerica.printful.me" "https://reedin.com" "https://velawatersportscabarete.com/"; do
            echo "=================================================="
            echo "URL: $url"
            echo "-- GET with browser UA --"
            curl -s -o /tmp/body.html -D /tmp/headers.txt -L -A "$UA" \
              -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8" \
              -H "Accept-Language: en-US,en;q=0.9" \
              --max-time 20 "$url" -w "FINAL_STATUS:%{http_code} FINAL_URL:%{url_effective} NUM_REDIRECTS:%{num_redirects}\n"
            echo "-- Response headers (all hops) --"
            cat /tmp/headers.txt
            echo "-- Body size and title --"
            wc -c /tmp/body.html
            grep -io "<title>[^<]*</title>" /tmp/body.html | head -1
            echo "-- Plain curl, no UA (to compare against a bot-flagged request) --"
            curl -s -o /dev/null --max-time 20 "$url" -w "STATUS:%{http_code}\n"
            echo
          done
