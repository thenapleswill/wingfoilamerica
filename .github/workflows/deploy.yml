name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Ensure CNAME is present in build output
        run: |
          expected="wingfoilamerica.com"
          if [ "$(cat _site/CNAME 2>/dev/null)" != "$expected" ]; then
            echo "::warning::_site/CNAME was missing or incorrect (source src/CNAME or its passthrough copy may have been removed) — writing it directly so the custom domain doesn't silently break."
            echo "$expected" > _site/CNAME
          fi
          echo "_site/CNAME contents going into this deploy:"
          cat _site/CNAME
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Ping IndexNow with all sitemap URLs
        run: |
          urls=$(curl -sS https://wingfoilamerica.com/sitemap.xml | grep -oE '<loc>[^<]+</loc>' | sed -E 's/<\/?loc>//g' | jq -R . | jq -s .)
          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"wingfoilamerica.com\",\"key\":\"b1bac83bbc32d0b178ae1789c5a3b490\",\"keyLocation\":\"https://wingfoilamerica.com/b1bac83bbc32d0b178ae1789c5a3b490.txt\",\"urlList\":$urls}"
