name: Weekly Analytics Snapshot

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch last 7 days of Web Analytics from Cloudflare
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p analytics-snapshots
          END=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          START=$(date -u -d "7 days ago" +"%Y-%m-%dT%H:%M:%SZ")
          # This is Cloudflare's internal Web Analytics "siteTag" as recorded on
          # rumPageloadEventsAdaptiveGroups rows -- confirmed directly against the
          # GraphQL API's actual data, NOT the same value as the public beacon
          # token in the <script data-cf-beacon> tag on the site (that one is
          # a356302bfd584a6baf958e945583b0bc). Cloudflare uses two distinct
          # identifiers here; querying with the beacon token instead of this one
          # silently matched zero rows for months even though the account/token
          # and beacon were all otherwise correctly configured.
          QUERY=$(jq -n --arg accountTag "$CF_ACCOUNT" --arg siteTag "243908f481794e2090849a5cd72f63d3" --arg start "$START" --arg end "$END" '{
            query: "query($accountTag: String!, $siteTag: String!, $start: Time!, $end: Time!) { viewer { accounts(filter: {accountTag: $accountTag}) { rumPageloadEventsAdaptiveGroups(limit: 100, orderBy: [count_DESC], filter: {siteTag: $siteTag, datetime_geq: $start, datetime_leq: $end}) { count dimensions { requestPath requestHost refererHost } } } } }",
            variables: { accountTag: $accountTag, siteTag: $siteTag, start: $start, end: $end }
          }')
          curl -sS -X POST "https://api.cloudflare.com/client/v4/graphql" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$QUERY" -o analytics-snapshots/latest.json
      - name: Commit snapshot if changed
        run: |
          git config user.name "analytics-bot"
          git config user.email "noreply@wingfoilamerica.com"
          git add analytics-snapshots/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Weekly analytics snapshot"
            git push
          else
            echo "No changes to commit"
          fi
