name: TEMP Click-test Spot Corrections
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Playwright
        run: |
          mkdir -p /tmp/pwtest && cd /tmp/pwtest
          npm init -y >/dev/null
          npm install playwright@1.47 >/dev/null 2>&1
          npx playwright install --with-deps chromium

      - name: Click-test both buttons on a live spot page
        run: |
          cat > /tmp/pwtest/test.mjs << 'SCRIPT'
          import { chromium } from "playwright";

          const SPOT_URL = "https://wingfoilamerica.com/where-to-ride/cumbuco/";
          const STAMP = new Date().toISOString();
          const CORRECTION_MSG = `TEST SUBMISSION (Claude verification, correction) - ${STAMP}`;
          const CONFIRMATION_MSG = `TEST SUBMISSION (Claude verification, confirmation) - ${STAMP}`;

          const browser = await chromium.launch();
          const page = await browser.newPage({ viewport: { width: 1280, height: 1000 } });
          await page.goto(SPOT_URL, { waitUntil: "networkidle" });

          async function runFlow(feedbackType, message, label) {
            console.log(`\n=== ${label} ===`);
            await page.click("#spotFeedbackOpen");
            await page.waitForSelector("#spotFeedbackModal:not([hidden])");
            await page.click(`#spotFeedbackChoice button[data-feedback-type="${feedbackType}"]`);
            await page.waitForSelector("#spotFeedbackForm:not([hidden])");
            await page.fill("#spotFeedbackMessage", message);
            const testEmail = "claude-test@example.invalid";
            await page.fill("#spotFeedbackEmail", testEmail);
            await page.click("#spotFeedbackForm button[type=submit]");
            await page.waitForSelector("#spotFeedbackAirtableWrap:not([hidden])");
            const iframeSrc = await page.getAttribute("#spotFeedbackIframe", "src");
            console.log("Iframe src (prefill check):", iframeSrc);
            const url = new URL(iframeSrc);
            console.log("prefill_Spot ID:", url.searchParams.get("prefill_Spot ID"));
            console.log("prefill_Spot Name:", url.searchParams.get("prefill_Spot Name"));
            console.log("prefill_Submission Type:", url.searchParams.get("prefill_Submission Type"));
            console.log("prefill_Message:", url.searchParams.get("prefill_Message"));
            console.log("prefill_Email:", url.searchParams.get("prefill_Email"));
            console.log("hide_Spot ID:", url.searchParams.get("hide_Spot ID"));
            console.log("hide_Spot Name:", url.searchParams.get("hide_Spot Name"));
            console.log("hide_Submission Type:", url.searchParams.get("hide_Submission Type"));

            // Now actually submit the real embedded Airtable form inside the iframe.
            const frame = page.frameLocator("#spotFeedbackIframe");
            await page.waitForTimeout(4000); // let Airtable's embed finish rendering
            await page.screenshot({ path: `/tmp/pwtest/${feedbackType}-before-submit.png`, fullPage: true });

            try {
              const submitBtn = frame.getByRole("button", { name: /submit/i }).first();
              await submitBtn.waitFor({ state: "visible", timeout: 20000 });
              await submitBtn.click();
              await page.waitForTimeout(3000);
              await page.screenshot({ path: `/tmp/pwtest/${feedbackType}-after-submit.png`, fullPage: true });
              console.log(`${label}: submit button clicked, screenshot saved.`);
            } catch (e) {
              console.log(`${label}: could not find/click submit button inside iframe -- ${e.message}`);
              try {
                const innerHtml = await frame.locator("body").innerHTML();
                console.log("Iframe body HTML (first 3000 chars):", innerHtml.slice(0, 3000));
              } catch (e2) {
                console.log("Could not read iframe body HTML:", e2.message);
              }
            }

            // Close modal, reset for next run
            await page.click(".submit-spot-modal-close");
            await page.waitForSelector("#spotFeedbackModal[hidden]");
          }

          await runFlow("correction", CORRECTION_MSG, "TEST 1: Suggest a correction");
          await runFlow("confirmation", CONFIRMATION_MSG, "TEST 2: I ride/teach here — confirm this spot");

          await browser.close();
          console.log("\nCORRECTION_MSG=" + CORRECTION_MSG);
          console.log("CONFIRMATION_MSG=" + CONFIRMATION_MSG);
          SCRIPT
          cd /tmp/pwtest && node test.mjs

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: click-test-screenshots
          path: /tmp/pwtest/*.png
