name: TEMP - Diagnose Cloudflare Web Analytics beacon

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Walk the real type chain (Query -> viewer -> accounts) to find the actual Account type's fields
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          gql() {
            jq -n --arg q "$1" '{query: $q}' | curl -sS -X POST "https://api.cloudflare.com/client/v4/graphql" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              -d @-
          }

          echo "=== root query type name ==="
          ROOT=$(gql '{ __schema { queryType { name } } }' | jq -r '.data.__schema.queryType.name')
          echo "$ROOT"

          echo "=== viewer field's return type ==="
          gql "{ __type(name: \"$ROOT\") { fields { name type { name kind ofType { name kind } } } } }" > root_fields.json
          jq -c '.data.__type.fields[] | select(.name == "viewer")' root_fields.json
          VIEWER_TYPE=$(jq -r '.data.__type.fields[] | select(.name == "viewer") | (.type.name // .type.ofType.name)' root_fields.json)
          echo "viewer field type: $VIEWER_TYPE"

          echo "=== accounts field's return type ==="
          gql "{ __type(name: \"$VIEWER_TYPE\") { fields { name type { name kind ofType { name kind } } } } }" > viewer_fields.json
          jq -c '.data.__type.fields[] | select(.name == "accounts")' viewer_fields.json
          ACCOUNTS_TYPE=$(jq -r '.data.__type.fields[] | select(.name == "accounts") | (.type.ofType.name // .type.name)' viewer_fields.json)
          echo "accounts field type: $ACCOUNTS_TYPE"

          echo "=== ALL fields on the real Account type (ground truth, no more guessing) ==="
          gql "{ __type(name: \"$ACCOUNTS_TYPE\") { fields { name } } }" > account_fields.json
          jq -r '.data.__type.fields[].name' account_fields.json

          echo "=== of those, which mention rum, site, or web (candidates for a site registry) ==="
          jq -r '.data.__type.fields[].name | select(test("rum|site|web"; "i"))' account_fields.json

      - name: List zones on this Cloudflare account (REST API, checks wingfoilamerica.com is even under this account)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -sS "https://api.cloudflare.com/client/v4/zones?account.id=$CF_ACCOUNT" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" | jq -c '{success, errors}, (.result[]? | {name, id, status})'
