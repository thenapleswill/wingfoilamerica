name: TEMP - Diagnose Cloudflare Web Analytics beacon

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Walk the real type chain (Query -> viewer -> accounts) to find the actual Account type's fields
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          gql() {
            jq -n --arg q "$1" '{query: $q}' | curl -sS -X POST "https://api.cloudflare.com/client/v4/graphql" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              -d @-
          }
          # A field's type can be wrapped in an arbitrary number of NON_NULL/LIST
          # layers (e.g. [Account!]! is three deep). Recurse through .ofType
          # until a layer actually has a name, instead of guessing a fixed depth.
          JQ_REALNAME='def realname: if .name != null and .name != "" then .name elif .ofType != null then (.ofType | realname) else null end;'
          unwrap() {
            jq -r --arg field "$1" "$JQ_REALNAME"' .data.__type.fields[] | select(.name == $field) | .type | realname' "$2"
          }

          echo "=== root query type name ==="
          ROOT=$(gql '{ __schema { queryType { name } } }' | jq -r '.data.__schema.queryType.name')
          echo "$ROOT"

          echo "=== viewer field's return type ==="
          gql "{ __type(name: \"$ROOT\") { fields { name type { name kind ofType { name kind ofType { name kind ofType { name kind } } } } } } }" > root_fields.json
          VIEWER_TYPE=$(unwrap viewer root_fields.json)
          echo "viewer field type: $VIEWER_TYPE"

          echo "=== accounts field's return type ==="
          gql "{ __type(name: \"$VIEWER_TYPE\") { fields { name type { name kind ofType { name kind ofType { name kind ofType { name kind } } } } } } }" > viewer_fields.json
          ACCOUNTS_TYPE=$(unwrap accounts viewer_fields.json)
          echo "accounts field type: $ACCOUNTS_TYPE"

          echo "=== ALL fields on the real Account type (ground truth, no more guessing) ==="
          gql "{ __type(name: \"$ACCOUNTS_TYPE\") { fields { name } } }" > account_fields.json
          jq -r '.data.__type.fields[]?.name' account_fields.json

          echo "=== of those, which mention rum, site, or web (candidates for a site registry) ==="
          jq -r '.data.__type.fields[]?.name | select(test("rum|site|web"; "i"))' account_fields.json

      - name: List zones on this Cloudflare account (REST API, checks wingfoilamerica.com is even under this account)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -sS "https://api.cloudflare.com/client/v4/zones?account.id=$CF_ACCOUNT" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" | jq -c '{success, errors}, (.result[]? | {name, id, status})'

      - name: List registered Web Analytics (RUM) sites via the REST rum/site_info endpoint
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -sS "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/rum/site_info/list" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" | tee rum_sites.json | jq -c '{success, errors}, (.result[]? | {site_tag, host, auto_install})'
          echo ""
          echo "=== does our beacon token a356302bfd584a6baf958e945583b0bc appear here? ==="
          jq -c '.result[]? | select(.site_tag == "a356302bfd584a6baf958e945583b0bc")' rum_sites.json || true
