name: TEMP Link Audit
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx eleventy
      - run: npx pagefind --site _site
      - name: Extract and check links
        run: |
          cat > /tmp/link-audit.mjs << 'SCRIPT'
          import fs from "node:fs";
          import path from "node:path";
          import * as cheerio from "cheerio";

          const SITE = "_site";
          function walk(dir, out = []) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full, out);
              else if (entry.name.endsWith(".html")) out.push(full);
            }
            return out;
          }
          const htmlFiles = walk(SITE);
          const externalLinks = new Map();
          for (const file of htmlFiles) {
            const rel = "/" + path.relative(SITE, file);
            const $ = cheerio.load(fs.readFileSync(file, "utf8"));
            $("a[href]").each((_, el) => {
              const href = $(el).attr("href");
              if (!href || !/^https?:\/\//i.test(href)) return;
              if (!externalLinks.has(href)) externalLinks.set(href, []);
              externalLinks.get(href).push(rel);
            });
          }
          const links = [...externalLinks.entries()].map(([url, refs]) => ({ url, refs }));
          console.log(`Checking ${links.length} unique external links...\n`);

          const UA = "Mozilla/5.0 (compatible; WingFoilAmericaLinkAudit/1.0; +https://wingfoilamerica.com)";
          async function checkOne(url, timeoutMs = 15000) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            try {
              let res;
              try {
                res = await fetch(url, { method: "GET", redirect: "follow", signal: controller.signal, headers: { "User-Agent": UA } });
              } catch (e) {
                return { status: null, ok: false, error: e.message || String(e) };
              }
              return { status: res.status, ok: res.ok, finalUrl: res.url };
            } finally {
              clearTimeout(timer);
            }
          }

          const CONCURRENCY = 6;
          const results = [];
          let idx = 0;
          async function worker() {
            while (idx < links.length) {
              const i = idx++;
              const { url, refs } = links[i];
              const r = await checkOne(url);
              results.push({ url, refs, ...r });
            }
          }
          await Promise.all(Array.from({ length: CONCURRENCY }, worker));

          const broken = results.filter((r) => !r.ok);
          console.log(`=== ${broken.length} BROKEN / FAILED EXTERNAL LINKS (of ${links.length}) ===\n`);
          for (const b of broken) {
            console.log(`${b.status ?? "ERR"}  ${b.url}${b.error ? "  -- " + b.error : ""}`);
            for (const from of b.refs) console.log(`   <- ${from}`);
          }
          console.log("\n=== ALL RESULTS (for reference) ===");
          for (const r of results) {
            console.log(`${r.ok ? "OK " : "BAD"} ${r.status ?? "ERR"}  ${r.url}`);
          }
          SCRIPT
          node /tmp/link-audit.mjs
