name: _tmp Verify Locals Chip
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live cumbuco spot page and check for the chip
        run: |
          curl -sS https://wingfoilamerica.com/where-to-ride/cumbuco/ -o page.html
          echo "--- spot-locals-section ---"
          grep -A 15 'spot-locals-section' page.html || echo "NOT FOUND"
