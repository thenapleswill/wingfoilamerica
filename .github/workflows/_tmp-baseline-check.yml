name: Temp Baseline Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live sitemap.xml
        run: |
          echo "=== sitemap.xml ==="
          curl -sS https://wingfoilamerica.com/sitemap.xml -o /tmp/sitemap.xml
          echo "--- total <loc> count ---"
          grep -c '<loc>' /tmp/sitemap.xml || true
          echo "--- unique domains used ---"
          grep -oE 'https?://[^/<]+' /tmp/sitemap.xml | sort -u
          echo "--- count of /where-to-ride/ spot subpaths ---"
          grep -oE '<loc>[^<]+</loc>' /tmp/sitemap.xml | grep -c 'where-to-ride/.\+/' || true
          echo "--- checking for the 3 named pages ---"
          grep -q 'parawinging' /tmp/sitemap.xml && echo "FOUND parawinging" || echo "MISSING parawinging"
          grep -q 'been-a-few-times' /tmp/sitemap.xml && echo "FOUND been-a-few-times" || echo "MISSING been-a-few-times"
          grep -q 'gear-and-brands/level-up' /tmp/sitemap.xml && echo "FOUND level-up" || echo "MISSING level-up"
          echo "--- first 10 loc lines ---"
          grep -oE '<loc>[^<]+</loc>' /tmp/sitemap.xml | head -10
          echo "--- last 10 loc lines ---"
          grep -oE '<loc>[^<]+</loc>' /tmp/sitemap.xml | tail -10

      - name: Fetch gear-and-brands page
        run: |
          echo "=== /gear-and-brands/ ==="
          curl -sS https://wingfoilamerica.com/gear-and-brands/ -o /tmp/gear.html
          echo "--- <title> ---"
          grep -oE '<title>[^<]*</title>' /tmp/gear.html
          echo "--- H1 ---"
          grep -oE '<h1[^>]*>[^<]*(<[^>]+>[^<]*)*</h1>' /tmp/gear.html | head -5
          echo "--- brand links in 'Shop Direct From the Brands' area (rough count of external links after that heading) ---"
          python3 - <<'EOF'
          import re
          html = open('/tmp/gear.html').read()
          idx = html.find('Shop Direct')
          print("Found 'Shop Direct' at index:", idx)
          if idx >= 0:
              chunk = html[idx:idx+6000]
              links = re.findall(r'<a [^>]*href="(https?://[^"]+)"[^>]*>([^<]*)</a>', chunk)
              print(f"Found {len(links)} links in the ~6000 chars after heading:")
              for href, text in links:
                  print(f"  {text.strip()!r} -> {href}")
          EOF

      - name: Fetch safety-risk-disclaimer page
        run: |
          echo "=== /safety-risk-disclaimer/ ==="
          curl -sS https://wingfoilamerica.com/safety-risk-disclaimer/ -o /tmp/safety.html
          grep -io 'iwo\|wingsports\|certified instruction\|international wingsports' /tmp/safety.html | sort -u || echo "no matches"

      - name: Checkout repo for Playwright script
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install playwright@1.47
          npx playwright install --with-deps chromium

      - name: Check map marker accessible names
        run: node .github/workflows/_tmp-marker-check.mjs
