name: TEMP Check Brand Feeds
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check remaining candidates
        run: |
          UA="WingFoilAmericaGearNewsBot/1.0 (+https://wingfoilamerica.com)"
          for url in \
            "https://www.duotonesports.com/foilwing/about-us/news/index.xml" \
            "https://ozonegliders.com/blogs/wing.atom" \
            "https://ozonegliders.com/blogs/journal.atom" \
            "https://ozonegliders.com/wing/news/" \
            "https://ozonegliders.com/" \
            "https://www.f-one.world/news/?univers=foil" \
          ; do
            echo "=================================================="
            echo "URL: $url"
            code=$(curl -sL -o /tmp/feed.xml -A "$UA" --max-time 15 -w "%{http_code}" "$url")
            echo "STATUS: $code"
            size=$(wc -c < /tmp/feed.xml)
            echo "SIZE: $size bytes"
            echo "-- first 500 chars --"
            head -c 500 /tmp/feed.xml
            echo
            echo "-- entry/item/article count --"
            grep -o -E "<entry>|<item>" /tmp/feed.xml | wc -l
            echo
          done
