name: Temp Recheck Sept16 Items

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch gear-and-brands page (cache-busted)
        run: |
          echo "=== /gear-and-brands/ (cache-busted) ==="
          curl -sS -H "Cache-Control: no-cache" "https://wingfoilamerica.com/gear-and-brands/?cb=$(date +%s)" -o /tmp/gear.html
          echo "--- Full <title> tag ---"
          grep -oE '<title>[^<]*</title>' /tmp/gear.html
          echo "--- Full H1 ---"
          grep -oE '<h1[^>]*>[^<]*</h1>' /tmp/gear.html
          echo "--- response headers (check caching) ---"
          curl -sSI "https://wingfoilamerica.com/gear-and-brands/" | head -20
          echo "--- brand links in Shop Direct section ---"
          python3 - <<'EOF'
          import re
          html = open('/tmp/gear.html').read()
          idx = html.find('Shop Direct')
          chunk = html[idx:idx+6000]
          links = re.findall(r'<a [^>]*href="(https?://[^"]+)"[^>]*>([^<]*)</a>', chunk)
          print(f"Found {len(links)} brand links:")
          for href, text in links:
              print(f"  {text!r} -> {href}")
          EOF

      - name: Fetch safety-risk-disclaimer page (cache-busted)
        run: |
          echo "=== /safety-risk-disclaimer/ (cache-busted) ==="
          curl -sS "https://wingfoilamerica.com/safety-risk-disclaimer/?cb=$(date +%s)" -o /tmp/safety.html
          python3 - <<'EOF'
          import re
          html = open('/tmp/safety.html').read()
          idx = html.lower().find('iwo')
          print("Full IWO sentence context:")
          print(re.sub('<[^>]+>', ' ', html[max(0,idx-150):idx+350]).strip())
          links = re.findall(r'<a [^>]*href="([^"]*iwointl[^"]*)"[^>]*>([^<]*)</a>', html)
          print("IWO links found:", links)
          EOF

      - name: Check for GitHub Pages / Fastly cache headers
        run: |
          echo "=== Response headers for gear-and-brands ==="
          curl -sSI "https://wingfoilamerica.com/gear-and-brands/"
          echo "=== Current deployed commit marker (check _site build freshness via page source comment if any) ==="
          curl -sS "https://wingfoilamerica.com/gear-and-brands/" | grep -i "generator\|built" || echo "no build marker found in HTML"
