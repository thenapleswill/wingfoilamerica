name: TEMP Diagnose Analytics Query
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose Cloudflare GraphQL query
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          END=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          START=$(date -u -d "7 days ago" +"%Y-%m-%dT%H:%M:%SZ")

          echo "Configured CLOUDFLARE_ACCOUNT_ID var (masked partially): ${CF_ACCOUNT:0:6}...${CF_ACCOUNT: -4} (length ${#CF_ACCOUNT})"
          echo

          echo "=== TEST 1: exact current workflow query, as-is ==="
          Q1=$(jq -n --arg accountTag "$CF_ACCOUNT" --arg siteTag "a356302bfd584a6baf958e945583b0bc" --arg start "$START" --arg end "$END" '{
            query: "query($accountTag: String!, $siteTag: String!, $start: Time!, $end: Time!) { viewer { accounts(filter: {accountTag: $accountTag}) { accountTag rumPageloadEventsAdaptiveGroups(limit: 5, orderBy: [count_DESC], filter: {siteTag: $siteTag, datetime_geq: $start, datetime_leq: $end}) { count dimensions { requestPath requestHost refererHost } } } } }",
            variables: { accountTag: $accountTag, siteTag: $siteTag, start: $start, end: $end }
          }')
          curl -sS -X POST "https://api.cloudflare.com/client/v4/graphql" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            -d "$Q1" | tee /tmp/test1.json | jq .
          echo

          echo "=== TEST 4: correct accountTag, datetime filter only, NO siteTag filter -- see the real siteTag/requestHost values actually recorded ==="
          Q4=$(jq -n --arg accountTag "$CF_ACCOUNT" --arg start "$START" --arg end "$END" '{
            query: "query($accountTag: String!, $start: Time!, $end: Time!) { viewer { accounts(filter: {accountTag: $accountTag}) { accountTag rumPageloadEventsAdaptiveGroups(limit: 15, orderBy: [count_DESC], filter: {datetime_geq: $start, datetime_leq: $end}) { count dimensions { siteTag requestHost requestPath datetimeFifteenMinutes } } } } }",
            variables: { accountTag: $accountTag, start: $start, end: $end }
          }')
          curl -sS -X POST "https://api.cloudflare.com/client/v4/graphql" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            -d "$Q4" | tee /tmp/test4.json | jq .
          echo

          echo "=== TEST 5: same as test 4 but widen window to 30 days, in case 7-day window is the issue ==="
          START30=$(date -u -d "30 days ago" +"%Y-%m-%dT%H:%M:%SZ")
          Q5=$(jq -n --arg accountTag "$CF_ACCOUNT" --arg start "$START30" --arg end "$END" '{
            query: "query($accountTag: String!, $start: Time!, $end: Time!) { viewer { accounts(filter: {accountTag: $accountTag}) { accountTag rumPageloadEventsAdaptiveGroups(limit: 15, orderBy: [count_DESC], filter: {datetime_geq: $start, datetime_leq: $end}) { count dimensions { siteTag requestHost requestPath } } } } }",
            variables: { accountTag: $accountTag, start: $start, end: $end }
          }')
          curl -sS -X POST "https://api.cloudflare.com/client/v4/graphql" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            -d "$Q5" | tee /tmp/test5.json | jq .
