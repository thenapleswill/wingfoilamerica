name: TEMP - Cloudflare GraphQL schema introspection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  introspect:
    runs-on: ubuntu-latest
    steps:
      - name: Introspect schema, find rumPageloadEventsAdaptiveGroups dimensions field
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl -sS -X POST "https://api.cloudflare.com/client/v4/graphql" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"{ __schema { types { name fields { name } } } }"}' \
            -o schema.json

          echo "=== top-level errors, if any ==="
          jq -c '.errors // empty' schema.json

          echo "=== types whose name mentions RumPageloadEvents ==="
          jq -r '.data.__schema.types[]? | select(.name | test("RumPageloadEvents"; "i")) | .name' schema.json

          echo "=== fields on any type whose name mentions RumPageloadEvents and Dimensions ==="
          jq -c '.data.__schema.types[]? | select(.name | test("RumPageloadEvents.*Dimensions"; "i")) | {name, fields: [.fields[]?.name]}' schema.json

          echo "=== fields on the AdaptiveGroups type itself (to confirm dimensions field name) ==="
          jq -c '.data.__schema.types[]? | select(.name | test("RumPageloadEventsAdaptiveGroups$"; "i")) | {name, fields: [.fields[]?.name]}' schema.json
