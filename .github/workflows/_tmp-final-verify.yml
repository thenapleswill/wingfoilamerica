name: Temp Final Verify

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live sitemap.xml (fixes 1 & 2)
        run: |
          curl -sS https://wingfoilamerica.com/sitemap.xml -o /tmp/sitemap.xml
          echo "--- total <loc> count ---"
          grep -c '<loc>' /tmp/sitemap.xml || true
          echo "--- any non-wingfoilamerica.com domains in <loc> (should be none) ---"
          grep -oE '<loc>[^<]+</loc>' /tmp/sitemap.xml | grep -v 'wingfoilamerica\.com' || echo "NONE FOUND (good)"
          echo "--- count of /where-to-ride/ spot subpaths ---"
          grep -oE '<loc>[^<]+</loc>' /tmp/sitemap.xml | grep -c 'where-to-ride/.\+/' || true
          grep -q 'parawinging' /tmp/sitemap.xml && echo "FOUND parawinging" || echo "MISSING parawinging"
          grep -q 'been-a-few-times' /tmp/sitemap.xml && echo "FOUND been-a-few-times" || echo "MISSING been-a-few-times"
          grep -q 'gear-and-brands/level-up' /tmp/sitemap.xml && echo "FOUND level-up" || echo "MISSING level-up"

      - name: Fetch gear-and-brands page (fixes 3 & 4)
        run: |
          curl -sS https://wingfoilamerica.com/gear-and-brands/ -o /tmp/gear.html
          echo "--- <title> ---"
          grep -oE '<title>[^<]*</title>' /tmp/gear.html
          echo "--- H1 ---"
          grep -oE '<h1[^>]*>[^<]*</h1>' /tmp/gear.html
          python3 - <<'EOF'
          import re
          html = open('/tmp/gear.html').read()
          idx = html.find('Shop Direct')
          chunk = html[idx:idx+6000]
          links = re.findall(r'<a [^>]*href="(https?://[^"]+)"[^>]*>([^<]*)</a>', chunk)
          print(f"Found {len(links)} brand links:")
          for href, text in links:
              print(f"  {text!r} -> {href}")
          EOF

      - name: Fetch safety-risk-disclaimer page (fix 5)
        run: |
          curl -sS https://wingfoilamerica.com/safety-risk-disclaimer/ -o /tmp/safety.html
          python3 - <<'EOF'
          import re
          html = open('/tmp/safety.html').read()
          idx = html.lower().find('iwo')
          print("Context around 'iwo' mention:")
          print(re.sub('<[^>]+>', ' ', html[max(0,idx-100):idx+300]))
          links = re.findall(r'<a [^>]*href="([^"]*iwointl[^"]*)"[^>]*>([^<]*)</a>', html)
          print("IWO links found:", links)
          EOF

      - name: Checkout repo for Playwright script
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install playwright@1.47
          npx playwright install --with-deps chromium

      - name: Check ALL map marker accessible names (fix 6)
        run: node .github/workflows/_tmp-marker-check2.mjs
